[package]
name = "shield-security"
version = "0.1.0"
edition = "2021"
description = "Agent Shield On-Chain Security Contracts: Cryptographic Audit Anchor & Threat Registry on NEAR Protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.1.0", features = ["legacy"] }
borsh = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
